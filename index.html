<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary Meta Tags -->
    <title>Mohamed Tayal | AI Engineer & Full Stack Developer</title>
    <meta name="title" content="Mohamed Tayal | AI Engineer & Full Stack Developer">
    <meta name="description" content="Mohamed Tayal is an AI Engineer and Full Stack Developer building machine learning systems, intelligent web products, and production-ready software.">
    <meta name="robots" content="index, follow">
    <link id="seo-canonical" rel="canonical" href="https://www.tayal.me/">
    <meta name="application-name" content="Mohamed Tayal Portfolio">
    <meta name="author" content="Mohamed Tayal">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Mohamed Tayal Portfolio">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="https://www.tayal.me/">

    <meta property="og:image" content="https://www.tayal.me/images/profile.jpg">
    <meta property="og:image:alt" content="Mohamed Tayal, AI Engineer and Full Stack Developer">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.tayal.me/">
    <meta name="twitter:title" content="Mohamed Tayal | AI Engineer & Full Stack Developer">
    <meta name="twitter:description" content="Mohamed Tayal is an AI Engineer and Full Stack Developer building machine learning systems, intelligent web products, and production-ready software.">
    <meta name="twitter:image" content="https://www.tayal.me/images/profile.jpg">

    <!-- Fontsource handles fonts locally -->

    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/profile.jpg">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Structured Data / JSON-LD -->
    <script id="seo-jsonld" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Mohamed Tayal",
      "jobTitle": "AI Engineer & Full Stack Developer",
      "url": "https://www.tayal.me",
      "sameAs": [
        "https://github.com/mohamedtayal",
        "https://www.linkedin.com/in/mohamedtayal"
      ],
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Delta University for Science and Technology"
      },
      "knowsAbout": ["Artificial Intelligence", "Machine Learning", "Deep Learning", "React.js", "Python", "Full Stack Development"]
    }
    </script>
  </head>
  <body class="bg-background text-foreground overflow-x-hidden selection:bg-primary/30 selection:text-primary-glow">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
